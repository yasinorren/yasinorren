<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Paneli — Innomed Life Sciences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/admin.css"/>
</head>
<body>

<!-- ██ LOGIN ██ -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#0A5C8A"/><path d="M13 32L22 12L31 32" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="26" x2="28" y2="26" stroke="white" stroke-width="2.8" stroke-linecap="round"/><circle cx="22" cy="12" r="3" fill="#26C6DA"/></svg>
      <div><span class="login-brand">INNOMED</span><span class="login-sub">Admin Paneli</span></div>
    </div>
    <h2>Yönetim Girişi</h2>
    <p class="login-hint">Panele erişmek için kimlik bilgilerinizi girin.</p>
    <form id="loginForm">
      <div class="lg"><label>Kullanıcı Adı</label><input type="text" id="loginUser" value="admin" required/></div>
      <div class="lg"><label>Şifre</label><input type="password" id="loginPass" required/></div>
      <div class="login-err hidden" id="loginErr"></div>
      <button type="submit" class="btn-primary-a">Giriş Yap</button>
    </form>
  </div>
</div>

<!-- ██ DASHBOARD ██ -->
<div id="adminApp" class="admin-app hidden">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <svg width="32" height="32" viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#0A5C8A"/><path d="M13 32L22 12L31 32" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="26" x2="28" y2="26" stroke="white" stroke-width="2.8" stroke-linecap="round"/><circle cx="22" cy="12" r="3" fill="#26C6DA"/></svg>
      <div class="sb-brand"><span>INNOMED</span><small>Admin</small></div>
    </div>
    <nav class="sb-nav">
      <button class="sb-item active" data-page="dashboard">
        <svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="2" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="12" y="2" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="2" y="12" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="12" y="12" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        Dashboard
      </button>
      <button class="sb-item" data-page="products">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4 H16 V16 H4 Z" stroke="currentColor" stroke-width="1.5" fill="none" rx="2"/><path d="M8 8 H12 M8 11 H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Ürünler
      </button>
      <button class="sb-item" data-page="inquiries">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 4 H18 C18.6 4 19 4.4 19 5 V13 C19 13.6 18.6 14 18 14 H6 L2 18 V5 C2 4.4 2.4 4 3 4Z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        Sorgular
        <span class="sb-badge" id="sbBadge">0</span>
      </button>
      <button class="sb-item" data-page="sales">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 15 L7 10 L11 12 L17 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Satışlar
      </button>
      <button class="sb-item" data-page="settings">
        <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 2V4M10 16V18M18 10H16M4 10H2M15.6 4.4L14.2 5.8M5.8 14.2L4.4 15.6M15.6 15.6L14.2 14.2M5.8 5.8L4.4 4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Ayarlar
      </button>
    </nav>
    <div class="sb-footer">
      <div class="sb-user"><div class="sb-avatar">A</div><div class="sb-info"><span id="sbUsername">admin</span><small>Yönetici</small></div></div>
      <button id="logoutBtn" title="Çıkış">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M7 3H3C2.4 3 2 3.4 2 4V14C2 14.6 2.4 15 3 15H7M12 12L16 9L12 6M7 9H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="content-header" id="contentHeader">
      <h1 id="pageTitle">Dashboard</h1>
      <div id="pageActions"></div>
    </div>
    <div class="content-body" id="contentBody"></div>
  </main>

</div>

<!-- ██ PRODUCT MODAL ██ -->
<div class="modal-bg hidden" id="productModal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="pmTitle">Ürün Ekle</h3><button class="modal-x" id="pmClose">&times;</button></div>
    <form id="productForm" class="modal-form">
      <input type="hidden" id="pmId"/>
      <div class="mf-row">
        <div class="mfg"><label>Katalog No</label><input type="text" id="pmCatalog"/></div>
        <div class="mfg"><label>Kategori *</label>
          <select id="pmCat" required>
            <option value="clinical">Klinik Mikrobiyoloji</option>
            <option value="industrial">Endüstriyel Mikrobiyoloji</option>
            <option value="environment">Çevre Kontrolü</option>
            <option value="helicomed">HelicoMed</option>
          </select>
        </div>
      </div>
      <div class="mf-row">
        <div class="mfg"><label>Ürün Adı (TR) *</label><input type="text" id="pmNameTr" required/></div>
        <div class="mfg"><label>Ürün Adı (EN) *</label><input type="text" id="pmNameEn" required/></div>
      </div>
      <div class="mfg"><label>Alt Kategori</label><input type="text" id="pmSubcat"/></div>
      <div class="mfg"><label>Açıklama (TR)</label><textarea id="pmDescTr" rows="3"></textarea></div>
      <div class="mfg"><label>Açıklama (EN)</label><textarea id="pmDescEn" rows="3"></textarea></div>
      <div class="mf-row">
        <div class="mfg"><label>Format</label><input type="text" id="pmFormat" placeholder="Petri Plate, Tube..."/></div>
        <div class="mfg"><label>Birim</label><input type="text" id="pmUnit" value="adet"/></div>
      </div>
      <div class="mf-row">
        <div class="mfg"><label>Fiyat</label><input type="number" id="pmPrice" step="0.01" min="0"/></div>
        <div class="mfg"><label>Para Birimi</label><select id="pmCurrency"><option value="USD">USD</option><option value="EUR">EUR</option><option value="TRY">TRY</option></select></div>
      </div>
      <div class="mf-row">
        <div class="mfg"><label>Stok Durumu</label>
          <select id="pmStockStatus">
            <option value="available">Stokta Var</option>
            <option value="limited">Sınırlı Stok</option>
            <option value="out_of_stock">Stok Dışı</option>
          </select>
        </div>
        <div class="mfg"><label>Stok Miktarı</label><input type="number" id="pmStockQty" min="0"/></div>
      </div>
      <div class="mf-check"><label><input type="checkbox" id="pmFeatured"/> Öne Çıkan Ürün</label></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="pmCancelBtn">İptal</button>
        <button type="submit" class="btn-primary-a" id="pmSubmitBtn">Kaydet</button>
      </div>
    </form>
  </div>
</div>

<!-- ██ SALE MODAL ██ -->
<div class="modal-bg hidden" id="saleModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Satış Ekle</h3><button class="modal-x" id="smClose">&times;</button></div>
    <form id="saleForm" class="modal-form">
      <div class="mf-row">
        <div class="mfg"><label>Ürün Seç</label>
          <select id="smProductSel">
            <option value="">Manuel giriş</option>
          </select>
        </div>
        <div class="mfg"><label>Ürün Adı *</label><input type="text" id="smProductName" required/></div>
      </div>
      <div class="mf-row">
        <div class="mfg"><label>Katalog No</label><input type="text" id="smCatalog"/></div>
        <div class="mfg"><label>Miktar *</label><input type="number" id="smQty" min="1" required/></div>
      </div>
      <div class="mf-row">
        <div class="mfg"><label>Birim Fiyat</label><input type="number" id="smUnitPrice" step="0.01" min="0"/></div>
        <div class="mfg"><label>Para Birimi</label><select id="smCurrency"><option value="USD">USD</option><option value="EUR">EUR</option><option value="TRY">TRY</option></select></div>
      </div>
      <div class="mf-row">
        <div class="mfg"><label>Müşteri Adı</label><input type="text" id="smCustomer"/></div>
        <div class="mfg"><label>Şirket</label><input type="text" id="smCompany"/></div>
      </div>
      <div class="mf-row">
        <div class="mfg"><label>Ülke</label><input type="text" id="smCountry" value="Turkey"/></div>
        <div class="mfg"><label>Satış Tarihi</label><input type="date" id="smDate"/></div>
      </div>
      <div class="mfg"><label>Notlar</label><textarea id="smNotes" rows="2"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="smCancelBtn">İptal</button>
        <button type="submit" class="btn-primary-a">Kaydet</button>
      </div>
    </form>
  </div>
</div>

<!-- ██ INQUIRY MODAL ██ -->
<div class="modal-bg hidden" id="inqModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Sorgu Detayı</h3><button class="modal-x" id="imClose">&times;</button></div>
    <div id="inqDetail" class="inq-detail"></div>
    <form id="inqUpdateForm" class="modal-form">
      <input type="hidden" id="imId"/>
      <div class="mf-row">
        <div class="mfg"><label>Durum</label>
          <select id="imStatus">
            <option value="new">Yeni</option>
            <option value="read">Okundu</option>
            <option value="responded">Yanıtlandı</option>
            <option value="closed">Kapatıldı</option>
          </select>
        </div>
      </div>
      <div class="mfg"><label>Admin Notu</label><textarea id="imNotes" rows="3"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="imCancelBtn">Kapat</button>
        <button type="submit" class="btn-primary-a">Güncelle</button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/js/admin.js"></script>
</body>
</html>
