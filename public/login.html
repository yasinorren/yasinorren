<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap — Bilim Platformu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="site-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.663 17h4.673M12 3v1m6.364 1.636-.707.707M21 12h-1M4 12H3m3.343-5.657-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        Bilim Platformu
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Hoş Geldiniz</h1>
      <p class="subtitle">Devam etmek için hesabınıza giriş yapın.</p>

      <div id="alertBox"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-posta Adresi <span class="req">*</span></label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="ornek@eposta.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Şifre <span class="req">*</span></label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="submitBtn">
          Giriş Yap
        </button>
      </form>

      <div class="auth-divider">Hesabınız yok mu?</div>
      <a href="/register.html" class="btn btn-secondary w-full">Yeni Hesap Oluştur</a>
      <div class="mt-2 text-center text-small text-muted">
        <a href="/">Ana sayfaya dön</a>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
