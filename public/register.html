<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol — Bilim.tr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="site-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.663 17h4.673M12 3v1m6.364 1.636-.707.707M21 12h-1M4 12H3m3.343-5.657-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        Bilim<span class="logo-dot">.</span>tr
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Hesap Oluştur</h1>
      <p class="subtitle">Bilimsel içeriklere katkıda bulunmaya başlayın.</p>

      <div id="alertBox"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Kullanıcı Adı <span class="req">*</span></label>
          <input class="form-control" type="text" id="username" name="username" required autocomplete="username"
            placeholder="ornek_kullanici" minlength="3" maxlength="40">
          <span class="form-hint">3–40 karakter, boşluk olmadan.</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">E-posta Adresi <span class="req">*</span></label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="ornek@eposta.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Şifre <span class="req">*</span></label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="new-password"
            placeholder="••••••••" minlength="6">
          <span class="form-hint">En az 6 karakter.</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="password2">Şifre Tekrar <span class="req">*</span></label>
          <input class="form-control" type="password" id="password2" name="password2" required autocomplete="new-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="submitBtn">
          Hesap Oluştur
        </button>
      </form>

      <div class="auth-divider">Zaten hesabınız var mı?</div>
      <a href="/login.html" class="btn btn-secondary w-full">Giriş Yap</a>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
