<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#030307"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="description" content="Trowded – Next Generation Social Platform"/>
  <title>Trowded</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body>

<!-- ═══ SPLASH ═══ -->
<div id="splash">
  <div class="splash-orb orb-1"></div>
  <div class="splash-orb orb-2"></div>
  <div class="splash-orb orb-3"></div>
  <div class="splash-center">
    <div class="splash-logo-wrap">
      <div class="splash-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" fill="url(#si-g)"/>
          <path d="M22 24a10 10 0 0 1 20 0" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <circle cx="32" cy="34" r="6" fill="white"/>
          <path d="M22 44a10 10 0 0 0 20 0" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <defs>
            <linearGradient id="si-g" x1="0" y1="0" x2="64" y2="64">
              <stop offset="0%" stop-color="#7B61FF"/>
              <stop offset="100%" stop-color="#FF61AB"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="splash-wordmark">trowded</div>
    </div>
    <p class="splash-tagline">Connect. Create. Inspire.</p>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  </div>
</div>

<!-- ═══ AUTH ═══ -->
<div id="auth-screen" class="page hidden">
  <div class="auth-blob blob-a"></div>
  <div class="auth-blob blob-b"></div>
  <div class="auth-blob blob-c"></div>
  <div class="auth-grid"></div>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="url(#ab-g)"/><path d="M14 15a6 6 0 0 1 12 0" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="20" cy="21" r="4" fill="white"/><path d="M14 27a6 6 0 0 0 12 0" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/><defs><linearGradient id="ab-g" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#7B61FF"/><stop offset="1" stop-color="#FF61AB"/></linearGradient></defs></svg>
      </div>
      <span class="brand-name">trowded</span>
    </div>

    <!-- Login -->
    <div id="auth-login" class="auth-card glass-card">
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Sign in to your account</p>
      <div class="field-wrap">
        <input id="li-id" class="glass-input" type="text" placeholder="Username or email" autocomplete="username"/>
      </div>
      <div class="field-wrap pw-wrap">
        <input id="li-pw" class="glass-input" type="password" placeholder="Password" autocomplete="current-password"/>
        <button class="pw-eye" onclick="togglePw('li-pw')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="li-2fa" class="field-wrap hidden">
        <input id="li-totp" class="glass-input" type="text" inputmode="numeric" maxlength="6" placeholder="Authenticator code"/>
      </div>
      <div id="li-err" class="auth-err hidden"></div>
      <button class="btn-grad btn-full" onclick="App.auth.login()">Sign In</button>
      <div class="auth-sep"><span>or</span></div>
      <button class="btn-ghost-full" onclick="App.auth.showReg()">Create an account</button>
    </div>

    <!-- Register -->
    <div id="auth-register" class="auth-card glass-card hidden">
      <h2 class="auth-title">Join Trowded</h2>
      <p class="auth-sub">It's free and always will be</p>
      <div class="field-wrap">
        <input id="rg-name" class="glass-input" type="text" placeholder="Your full name" maxlength="80"/>
      </div>
      <div class="field-wrap">
        <input id="rg-user" class="glass-input" type="text" placeholder="Username (letters, numbers, _)" maxlength="30"/>
      </div>
      <div class="field-wrap">
        <input id="rg-email" class="glass-input" type="email" placeholder="Email address"/>
      </div>
      <div class="field-wrap pw-wrap">
        <input id="rg-pw" class="glass-input" type="password" placeholder="Password (8+ chars, A-Z, a-z, 0-9)"/>
        <button class="pw-eye" onclick="togglePw('rg-pw')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="pw-str-bar" class="pw-strength-bar"><div id="pw-str-fill" class="pw-strength-fill"></div></div>
      <div id="rg-err" class="auth-err hidden"></div>
      <button class="btn-grad btn-full" onclick="App.auth.register()">Create Account</button>
      <div class="auth-sep"><span>or</span></div>
      <button class="btn-ghost-full" onclick="App.auth.showLogin()">Already have an account?</button>
    </div>
  </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="app" class="page hidden">

  <!-- TOP BAR -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <div class="topbar-logo" id="topbar-logo">trowded</div>
      <button class="topbar-back hidden" id="topbar-back" onclick="App.nav.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <span class="topbar-title hidden" id="topbar-title"></span>
    </div>
    <div class="topbar-right" id="topbar-right">
      <button class="icon-btn" onclick="App.nav.go('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button class="icon-btn pos-rel" onclick="App.nav.go('chat')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="dot-badge hidden" id="dm-dot"></span>
      </button>
    </div>
  </header>

  <!-- SCREENS -->
  <main class="screens" id="screens">

    <!-- HOME -->
    <section id="sc-home" class="screen active">
      <div class="stories-strip" id="stories-strip">
        <div class="story-chip add-story" onclick="App.stories.showCreate()">
          <div class="story-ring-wrap add-ring"><div class="story-av-shell"><span class="add-plus">+</span></div></div>
          <span>Your Story</span>
        </div>
      </div>
      <div id="feed-list"></div>
      <div id="feed-spinner" class="center-spin hidden"><div class="spin-ring"></div></div>
    </section>

    <!-- EXPLORE -->
    <section id="sc-explore" class="screen">
      <div class="explore-search-wrap">
        <div class="explore-search-inner">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="exp-q" class="explore-inp" type="text" placeholder="Search posts, people, tags…" oninput="App.explore.debounce()"/>
        </div>
      </div>
      <div id="exp-results" class="hidden"></div>
      <div id="exp-main">
        <div id="exp-trending"></div>
        <div id="exp-grid" class="explore-grid"></div>
      </div>
    </section>

    <!-- NOTIFICATIONS -->
    <section id="sc-notifications" class="screen">
      <div id="notif-list"></div>
    </section>

    <!-- PROFILE -->
    <section id="sc-profile" class="screen">
      <div id="own-profile"></div>
    </section>

    <!-- CHAT LIST -->
    <section id="sc-chat" class="screen">
      <div class="chat-list-header">
        <h2>Messages</h2>
        <button class="icon-btn" onclick="App.chat.newDM()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="chat-list"></div>
    </section>

    <!-- SEARCH (full) -->
    <section id="sc-search" class="screen sub">
      <div class="search-full-bar">
        <input id="search-q" class="search-full-inp" type="text" placeholder="Search…" autofocus oninput="App.search.run()"/>
      </div>
      <div id="search-out"></div>
    </section>

    <!-- POST DETAIL -->
    <section id="sc-post" class="screen sub">
      <div id="post-detail-content"></div>
    </section>

    <!-- USER PROFILE -->
    <section id="sc-userprofile" class="screen sub">
      <div id="user-profile-out"></div>
    </section>

    <!-- CONVERSATION -->
    <section id="sc-conv" class="screen sub conv-screen">
      <div class="conv-topbar" id="conv-topbar">
        <div class="conv-user" id="conv-user"></div>
        <div class="e2ee-badge" id="conv-e2ee-badge" title="End-to-End Encrypted">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>E2EE</span>
        </div>
      </div>
      <div class="e2ee-notice" id="e2ee-notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Messages are end-to-end encrypted. Nobody — not even Trowded — can read them.
      </div>
      <div id="msg-list" class="msg-list"></div>
      <div class="msg-input-bar">
        <div class="msg-input-wrap">
          <input id="msg-inp" class="msg-inp" type="text" placeholder="Message…" onkeydown="if(event.key==='Enter')App.chat.send()"/>
        </div>
        <button class="send-btn" onclick="App.chat.send()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="sc-settings" class="screen sub">
      <div id="settings-out"></div>
    </section>

    <!-- EDIT PROFILE -->
    <section id="sc-editprofile" class="screen sub">
      <div id="editprofile-out"></div>
    </section>

    <!-- 2FA -->
    <section id="sc-2fa" class="screen sub">
      <div id="twofa-out"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottomnav" id="bottomnav">
    <div class="nav-indicator" id="nav-indicator"></div>
    <button class="nav-item active" data-tab="home" onclick="App.nav.go('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="explore" onclick="App.nav.go('explore')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>Explore</span>
    </button>
    <button class="nav-item nav-create" onclick="App.post.showCreate()">
      <div class="nav-create-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </button>
    <button class="nav-item" data-tab="notifications" onclick="App.nav.go('notifications')">
      <div class="pos-rel d-inline">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span class="notif-badge hidden" id="notif-badge"></span>
      </div>
      <span>Activity</span>
    </button>
    <button class="nav-item" data-tab="profile" onclick="App.nav.go('profile')">
      <div class="nav-av" id="nav-av">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </div>
      <span>Profile</span>
    </button>
  </nav>

</div><!-- #app -->

<!-- ═══ MODALS ═══ -->

<!-- Create Post -->
<div id="modal-create" class="modal-overlay hidden">
  <div class="modal-sheet glass-sheet">
    <div class="modal-drag-bar"></div>
    <div class="modal-head">
      <button class="btn-cancel" onclick="App.post.closeCreate()">Cancel</button>
      <span class="modal-title">New Post</span>
      <button class="btn-post-submit" id="post-submit-btn" onclick="App.post.submit()">Post</button>
    </div>
    <div class="create-body">
      <div class="create-user-row" id="create-user-row"></div>
      <textarea id="post-ta" placeholder="What's happening?" maxlength="5000" oninput="App.post.onInput()"></textarea>
      <div class="post-char-row"><span id="post-char">5000</span></div>
      <div id="media-preview-row" class="media-prev-row"></div>
      <div class="create-toolbar">
        <label class="icon-btn toolbar-ico" for="media-file-inp" title="Add media">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </label>
        <input id="media-file-inp" type="file" accept="image/*,video/*" multiple class="hidden" onchange="App.post.addMedia(event)"/>
        <select id="post-vis" class="vis-picker">
          <option value="public">🌍 Everyone</option>
          <option value="followers">👥 Followers</option>
          <option value="private">🔒 Only me</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- Story Viewer -->
<div id="modal-story" class="modal-overlay story-modal hidden">
  <div class="story-viewer">
    <div class="story-segs" id="story-segs"></div>
    <div class="story-vh">
      <div class="story-vuser" id="story-vuser"></div>
      <button class="sv-close" onclick="App.stories.close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="story-vbody" id="story-vbody"></div>
    <div class="sv-left"  onclick="App.stories.prev()"></div>
    <div class="sv-right" onclick="App.stories.next()"></div>
    <div class="story-vfoot">
      <input class="story-reply" placeholder="Reply to story…" readonly onclick="App.toast('Story replies coming soon!')"/>
      <button class="story-heart-btn" onclick="App.toast('❤️')">♥</button>
    </div>
  </div>
</div>

<!-- Comments -->
<div id="modal-comments" class="modal-overlay hidden">
  <div class="modal-sheet glass-sheet comments-sheet">
    <div class="modal-drag-bar"></div>
    <div class="modal-head">
      <span class="modal-title">Comments</span>
      <button class="sv-close" onclick="App.comments.close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="comments-list" class="comments-list"></div>
    <div class="comment-bar">
      <div class="comment-av" id="comment-av-me"></div>
      <input id="comment-inp" class="comment-inp" type="text" placeholder="Add a comment…" maxlength="1000" onkeydown="if(event.key==='Enter')App.comments.submit()"/>
      <button class="send-btn" onclick="App.comments.submit()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- Action sheet -->
<div id="action-sheet" class="modal-overlay hidden">
  <div class="modal-sheet glass-sheet action-sheet" id="action-sheet-body"></div>
</div>

<script src="/assets/js/app.js"></script>
</body>
</html>
