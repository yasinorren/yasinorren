<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0A0A0F"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="description" content="Trowded – The next generation social media platform"/>
  <title>Trowded</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body>

<!-- ═══════════ SPLASH SCREEN ═══════════ -->
<div id="splash">
  <div class="splash-logo">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="32" fill="url(#sg)"/>
      <path d="M20 22C20 22 24 18 32 18C40 18 44 22 44 22" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="8" fill="white" fill-opacity="0.9"/>
      <path d="M20 42C20 42 24 46 32 46C40 46 44 42 44 42" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0%" stop-color="#7B61FF"/>
          <stop offset="100%" stop-color="#FF61AB"/>
        </linearGradient>
      </defs>
    </svg>
    <span>trowded</span>
  </div>
  <div class="splash-tagline">Connect. Create. Inspire.</div>
  <div class="splash-loader"><div class="splash-progress"></div></div>
</div>

<!-- ═══════════ AUTH SCREEN ═══════════ -->
<div id="auth-screen" class="screen hidden">
  <div class="auth-bg"></div>
  <div class="auth-container">
    <div class="auth-logo">
      <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="32" fill="url(#ag)"/>
        <path d="M20 22C20 22 24 18 32 18C40 18 44 22 44 22" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="32" r="8" fill="white" fill-opacity="0.9"/>
        <path d="M20 42C20 42 24 46 32 46C40 46 44 42 44 42" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <defs><linearGradient id="ag" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#7B61FF"/><stop offset="100%" stop-color="#FF61AB"/></linearGradient></defs>
      </svg>
      <h1>trowded</h1>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="auth-form">
      <h2>Welcome back</h2>
      <p class="auth-sub">Sign in to your account</p>
      <div class="form-group">
        <input id="login-identifier" type="text" placeholder="Username or email" autocomplete="username"/>
      </div>
      <div class="form-group password-group">
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password"/>
        <button class="toggle-pw" onclick="togglePw('login-password')">👁</button>
      </div>
      <div id="login-2fa" class="form-group hidden">
        <input id="login-totp" type="text" placeholder="6-digit authenticator code" maxlength="6" inputmode="numeric"/>
      </div>
      <div id="login-error" class="auth-error hidden"></div>
      <button class="btn-primary btn-full" onclick="App.auth.login()">Sign In</button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-ghost btn-full" onclick="App.auth.showRegister()">Create account</button>
    </div>

    <!-- Register Form -->
    <div id="register-form" class="auth-form hidden">
      <h2>Join Trowded</h2>
      <p class="auth-sub">Create your account</p>
      <div class="form-group">
        <input id="reg-display" type="text" placeholder="Your name" maxlength="80"/>
      </div>
      <div class="form-group">
        <input id="reg-username" type="text" placeholder="Username (letters, numbers, _)" maxlength="30"/>
      </div>
      <div class="form-group">
        <input id="reg-email" type="email" placeholder="Email address"/>
      </div>
      <div class="form-group password-group">
        <input id="reg-password" type="password" placeholder="Password (8+ chars, A-Z, a-z, 0-9)"/>
        <button class="toggle-pw" onclick="togglePw('reg-password')">👁</button>
      </div>
      <div class="password-strength" id="pw-strength"></div>
      <div id="reg-error" class="auth-error hidden"></div>
      <button class="btn-primary btn-full" onclick="App.auth.register()">Create Account</button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-ghost btn-full" onclick="App.auth.showLogin()">Already have an account?</button>
    </div>
  </div>
</div>

<!-- ═══════════ MAIN APP ═══════════ -->
<div id="app" class="hidden">

  <!-- TOP BAR -->
  <header class="top-bar" id="top-bar">
    <div class="top-bar-left">
      <div class="app-wordmark">trowded</div>
    </div>
    <div class="top-bar-center" id="top-bar-title"></div>
    <div class="top-bar-right">
      <button class="icon-btn" id="btn-search-open" onclick="App.nav.go('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button class="icon-btn" id="btn-dm" onclick="App.nav.go('chat')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span class="notif-dot hidden" id="dm-dot"></span>
      </button>
    </div>
  </header>

  <!-- SCREENS -->
  <main class="screen-container" id="screen-container">

    <!-- ── HOME FEED ── -->
    <section id="screen-home" class="tab-screen active">
      <!-- Stories Row -->
      <div class="stories-row" id="stories-row">
        <div class="story-item story-add" onclick="App.stories.showCreate()">
          <div class="story-avatar-wrap add">
            <div class="story-avatar-inner">+</div>
          </div>
          <span>Your Story</span>
        </div>
      </div>
      <!-- Feed -->
      <div id="feed-container"></div>
      <div id="feed-loader" class="loader-wrap hidden"><div class="spinner"></div></div>
    </section>

    <!-- ── EXPLORE ── -->
    <section id="screen-explore" class="tab-screen">
      <div class="explore-search-bar">
        <input type="text" id="explore-search-input" placeholder="Search people, posts, tags..." oninput="App.search.debounce()"/>
      </div>
      <div id="search-results" class="hidden"></div>
      <div id="explore-content">
        <div class="explore-trending" id="explore-trending"></div>
        <div class="explore-grid" id="explore-grid"></div>
      </div>
    </section>

    <!-- ── NOTIFICATIONS ── -->
    <section id="screen-notifications" class="tab-screen">
      <div id="notif-list"></div>
    </section>

    <!-- ── PROFILE ── -->
    <section id="screen-profile" class="tab-screen">
      <div id="profile-content"></div>
    </section>

    <!-- ── CHAT LIST ── -->
    <section id="screen-chat" class="tab-screen">
      <div class="chat-header-bar">
        <h2>Messages</h2>
        <button class="icon-btn" onclick="App.chat.showNewDM()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="chat-list"></div>
    </section>

    <!-- ── SEARCH ── -->
    <section id="screen-search" class="tab-screen">
      <div class="search-bar-full">
        <button class="icon-btn" onclick="App.nav.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <input type="text" id="search-input-full" placeholder="Search..." autofocus oninput="App.search.fullSearch()"/>
      </div>
      <div id="search-full-results"></div>
    </section>

    <!-- ── SINGLE POST ── -->
    <section id="screen-post" class="tab-screen sub-screen">
      <div class="sub-header">
        <button class="icon-btn" onclick="App.nav.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <span>Post</span>
      </div>
      <div id="single-post-content"></div>
    </section>

    <!-- ── USER PROFILE (OTHER) ── -->
    <section id="screen-user-profile" class="tab-screen sub-screen">
      <div class="sub-header">
        <button class="icon-btn" onclick="App.nav.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <span id="user-profile-title">Profile</span>
      </div>
      <div id="user-profile-content"></div>
    </section>

    <!-- ── CHAT CONVERSATION ── -->
    <section id="screen-conversation" class="tab-screen sub-screen">
      <div class="conv-header">
        <button class="icon-btn" onclick="App.nav.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <div class="conv-user-info" id="conv-user-info"></div>
        <div></div>
      </div>
      <div id="messages-container" class="messages-container"></div>
      <div class="message-input-bar">
        <input type="text" id="message-input" placeholder="Message..." onkeydown="if(event.key==='Enter')App.chat.sendMessage()"/>
        <button class="send-btn" onclick="App.chat.sendMessage()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </section>

    <!-- ── SETTINGS ── -->
    <section id="screen-settings" class="tab-screen sub-screen">
      <div class="sub-header">
        <button class="icon-btn" onclick="App.nav.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <span>Settings</span>
      </div>
      <div id="settings-content"></div>
    </section>

    <!-- ── EDIT PROFILE ── -->
    <section id="screen-edit-profile" class="tab-screen sub-screen">
      <div class="sub-header">
        <button class="icon-btn" onclick="App.nav.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <span>Edit Profile</span>
        <button class="btn-text" onclick="App.profile.saveEdit()">Save</button>
      </div>
      <div id="edit-profile-content"></div>
    </section>

    <!-- ── 2FA SETUP ── -->
    <section id="screen-2fa" class="tab-screen sub-screen">
      <div class="sub-header">
        <button class="icon-btn" onclick="App.nav.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <span>Two-Factor Authentication</span>
      </div>
      <div id="twofa-content"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-tab="home" onclick="App.nav.go('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-tab="explore" onclick="App.nav.go('explore')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>Explore</span>
    </button>
    <button class="nav-btn create-btn" onclick="App.post.showCreate()">
      <div class="create-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </button>
    <button class="nav-btn" data-tab="notifications" onclick="App.nav.go('notifications')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <span class="notif-badge hidden" id="notif-badge">0</span>
      <span>Activity</span>
    </button>
    <button class="nav-btn" data-tab="profile" onclick="App.nav.go('profile')">
      <div class="nav-avatar" id="nav-avatar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </div>
      <span>Profile</span>
    </button>
  </nav>

</div>

<!-- ═══════════ MODALS ═══════════ -->

<!-- Create Post Modal -->
<div id="modal-create-post" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-header">
      <button class="btn-text" onclick="App.post.closeCreate()">Cancel</button>
      <span>New Post</span>
      <button class="btn-primary-sm" onclick="App.post.submit()">Post</button>
    </div>
    <div class="create-post-body">
      <div class="create-post-user" id="create-post-user"></div>
      <textarea id="post-content-input" placeholder="What's on your mind?" maxlength="5000" oninput="App.post.countChars()"></textarea>
      <div class="post-char-count" id="post-char-count">5000</div>
      <div class="create-media-preview" id="create-media-preview"></div>
      <div class="create-post-toolbar">
        <label class="icon-btn" for="post-media-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </label>
        <input id="post-media-input" type="file" accept="image/*,video/*" multiple class="hidden" onchange="App.post.handleMedia(event)"/>
        <button class="icon-btn" onclick="App.post.addLocation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </button>
        <select id="post-visibility" class="vis-select">
          <option value="public">🌍 Everyone</option>
          <option value="followers">👥 Followers</option>
          <option value="private">🔒 Only me</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- Story Viewer Modal -->
<div id="modal-story-viewer" class="modal-overlay hidden story-overlay">
  <div class="story-viewer-container">
    <div class="story-progress-bar" id="story-progress-bar"></div>
    <div class="story-viewer-header">
      <div class="story-user-info" id="story-viewer-user"></div>
      <button class="icon-btn-white" onclick="App.stories.close()">✕</button>
    </div>
    <div class="story-viewer-body" id="story-viewer-body">
      <div class="story-text" id="story-viewer-text"></div>
    </div>
    <div class="story-nav-prev" onclick="App.stories.prev()"></div>
    <div class="story-nav-next" onclick="App.stories.next()"></div>
    <div class="story-viewer-footer">
      <input type="text" placeholder="Reply to story..." class="story-reply-input" readonly onclick="App.toast('Story replies coming soon!')"/>
      <button class="story-heart-btn" onclick="App.stories.likeCurrentStory()">❤️</button>
    </div>
  </div>
</div>

<!-- Comments Modal -->
<div id="modal-comments" class="modal-overlay hidden">
  <div class="modal-sheet comments-sheet">
    <div class="modal-header">
      <span>Comments</span>
      <button class="icon-btn" onclick="App.comments.close()">✕</button>
    </div>
    <div id="comments-list" class="comments-list"></div>
    <div class="comment-input-bar">
      <div class="comment-avatar" id="comment-avatar"></div>
      <input type="text" id="comment-input" placeholder="Add a comment..." maxlength="1000" onkeydown="if(event.key==='Enter')App.comments.submit()"/>
      <button class="send-btn" onclick="App.comments.submit()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast" class="toast hidden"></div>

<script src="/assets/js/app.js"></script>
</body>
</html>
