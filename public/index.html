<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innomed Life Sciences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css?v=3">
</head>
<body>

  <!-- NAVBAR -->
  <nav id="navbar" class="navbar">
    <div class="nav-container">
      <a href="/" data-spa class="nav-logo">
        <div id="logoImgWrap"></div>
        <span id="siteNameText" class="nav-logo-text">Innomed Life Sciences</span>
      </a>
      <div id="mainNav" class="nav-links"></div>
      <div class="nav-actions">
        <button id="hamburger" class="hamburger-btn" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 6H19M3 11H19M3 16H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- MOBILE DRAWER -->
  <div id="mobileDrawer" class="mobile-drawer">
    <div class="mobile-drawer-header">
      <span class="nav-logo-text">Innomed</span>
      <button id="drawerClose" class="drawer-close" aria-label="Close">&#10005;</button>
    </div>
    <div id="mobileNavLinks" class="mobile-nav-links"></div>
  </div>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- APP CONTAINER -->
  <div id="app"></div>

  <!-- FOOTER -->
  <footer id="siteFooter" class="site-footer"></footer>

  <!-- BACK TO TOP -->
  <button id="backTop" class="back-top" aria-label="Back to top">&#8679;</button>

  <!-- INQUIRY MODAL -->
  <div id="inquiryModal" class="modal-overlay" style="display:none;align-items:center;justify-content:center">
    <div class="modal-box" style="max-width:480px;width:100%">
      <div class="modal-header">
        <h3 id="modalProductName" style="font-size:1rem;font-weight:600;color:#1E293B">Ürün Talebi</h3>
        <button id="modalClose" class="modal-close">&times;</button>
      </div>
      <form id="inquiryForm">
        <div class="form-group">
          <label>Ad Soyad *</label>
          <input name="customer_name" required placeholder="Adınız Soyadınız">
        </div>
        <div class="form-group">
          <label>E-posta *</label>
          <input name="customer_email" type="email" required placeholder="ornek@email.com">
        </div>
        <div class="form-group">
          <label>Mesaj</label>
          <textarea name="message" rows="3" placeholder="Mesajınız..."></textarea>
        </div>
        <div id="inqOk" style="display:none;padding:10px 14px;background:#dcfce7;border-radius:8px;color:#166534;font-size:.88rem;margin-bottom:10px">Talebiniz iletildi! En kısa sürede dönüş yapacağız.</div>
        <div id="inqErr" style="display:none;padding:10px 14px;background:#fee2e2;border-radius:8px;color:#991b1b;font-size:.88rem;margin-bottom:10px">Bir hata oluştu. Lütfen tekrar deneyin.</div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Gönder</button>
      </form>
    </div>
  </div>

  <script src="/assets/js/main.js?v=3"></script>
</body>
</html>
